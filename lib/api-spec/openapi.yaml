openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: story
    description: Living Phone story generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /story/providers:
    get:
      operationId: getStoryProviders
      tags: [story]
      summary: Get Living Phone provider status
      responses:
        "200":
          description: Provider connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
  /story/generate:
    post:
      operationId: generateStoryActivity
      tags: [story]
      summary: Generate proposed fictional phone activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryGenerationInput"
      responses:
        "200":
          description: Proposed activity for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryGenerationResult"
        "400":
          description: Invalid request
        "503":
          description: Text generation provider unavailable
  /story/image:
    post:
      operationId: generateStoryImage
      tags: [story]
      summary: Generate a fictional phone photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryImageInput"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryImageResult"
        "503":
          description: Image provider unavailable
  /story/image/upload:
    post:
      operationId: uploadStoryImage
      tags: [story]
      summary: Persist an uploaded story image
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/StoryImageFile"
      responses:
        "200":
          description: Persistent uploaded image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryImageUploadResult"
        "400":
          description: Invalid image or image exceeds 12 MB
        "503":
          description: Image storage unavailable
  /story/image/{imageId}:
    get:
      operationId: getStoryImage
      tags: [story]
      summary: Stream a persistent story image
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: JPEG, PNG, or WebP image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: Image not found
  /story/voice/transcript:
    post:
      operationId: generateVoiceTranscript
      tags: [story]
      summary: Draft a fictional voice memo transcript for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceTranscriptInput"
      responses:
        "200":
          description: Draft voice memo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTranscriptResult"
        "503":
          description: Text provider unavailable
  /story/voice/audio:
    post:
      operationId: generateVoiceAudio
      tags: [story]
      summary: Generate and persist audio for an approved memo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceAudioInput"
      responses:
        "200":
          description: Persistent generated audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAudioResult"
        "503":
          description: Audio provider or storage unavailable
  /story/voice/upload:
    post:
      operationId: uploadVoiceAudio
      tags: [story]
      summary: Persist manually uploaded voice audio
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/VoiceAudioFile"
      responses:
        "200":
          description: Persistent uploaded audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAudioResult"
        "400":
          description: Invalid or unsupported audio
  /story/voice/audio/{audioId}:
    get:
      operationId: getVoiceAudio
      tags: [story]
      summary: Stream persistent generated voice audio
      parameters:
        - name: audioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: WAV audio
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "404":
          description: Audio not found
components:
  schemas:
    VoiceAudioFile:
      type: string
      description: Raw audio bytes, up to 15 MB
    VoiceTranscriptInput:
      type: object
      required: [prompt, language]
      properties:
        prompt: { type: string, minLength: 3, maxLength: 2000 }
        language: { type: string, enum: [English, Korean, Mixed] }
    VoiceTranscriptResult:
      type: object
      required: [title, transcript, context, delivery, category, language]
      properties:
        title: { type: string }
        transcript: { type: string }
        context: { type: string }
        delivery: { type: string }
        category: { type: string }
        relatedEvent: { type: string }
        language: { type: string, enum: [English, Korean, Mixed] }
    VoiceAudioInput:
      type: object
      required: [transcript, voice, language]
      properties:
        transcript: { type: string, minLength: 1, maxLength: 4000 }
        voice: { type: string, enum: [alloy, echo, onyx] }
        language: { type: string, enum: [English, Korean, Mixed] }
        delivery: { type: string, maxLength: 300 }
    VoiceAudioResult:
      type: object
      required: [audioId, durationSeconds]
      properties:
        audioId: { type: string }
        durationSeconds: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProviderStatusItem:
      type: object
      properties:
        connected:
          type: boolean
        label:
          type: string
      required: [connected, label]
    ProviderStatus:
      type: object
      properties:
        text:
          $ref: "#/components/schemas/ProviderStatusItem"
        image:
          $ref: "#/components/schemas/ProviderStatusItem"
        music:
          $ref: "#/components/schemas/ProviderStatusItem"
        audio:
          $ref: "#/components/schemas/ProviderStatusItem"
      required: [text, image, music, audio]
    StoryGenerationInput:
      type: object
      properties:
        storyUpdate:
          type: string
          minLength: 3
          maxLength: 12000
        mode:
          type: string
          enum: [story_update, generate_day]
        canon:
          type: object
          additionalProperties: true
        existingPhone:
          type: object
          additionalProperties: true
      required: [storyUpdate, mode, canon, existingPhone]
    ActivityProposal:
      type: object
      properties:
        id:
          type: string
        app:
          type: string
          enum: [messages, instagram, echo, gallery, diary, notes, quickNotes, voice, music, studio, calendar, browser, calls, notifications, files, places, contacts]
        type:
          type: string
        title:
          type: string
        content:
          type: string
        timestamp:
          type: string
        person:
          type: ["string", "null"]
        metadata:
          type: object
          additionalProperties: true
      required: [id, app, type, title, content, timestamp, metadata]
    StoryGenerationResult:
      type: object
      properties:
        summary:
          type: string
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/ActivityProposal"
      required: [summary, proposals]
    StoryImageInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 2000
      required: [prompt]
    StoryImageResult:
      type: object
      properties:
        dataUrl:
          type: string
        caption:
          type: string
        imageId:
          type: string
          format: uuid
      required: [dataUrl, caption]
    StoryImageFile:
      type: string
      description: Raw JPEG, PNG, or WebP bytes, up to 12 MB
    StoryImageUploadResult:
      type: object
      properties:
        imageId:
          type: string
          format: uuid
      required: [imageId]

